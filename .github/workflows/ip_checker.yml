name: IP Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: ip-checker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check-ips:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install dnspython requests

      - name: List directory contents before
        shell: pwsh
        run: |
          Get-ChildItem
          if (Test-Path "CloudflareScanner") {
            Get-ChildItem "CloudflareScanner"
          } else {
            Write-Host "CloudflareScanner 目录不存在"
          }

      - name: Run IP checker script
        shell: pwsh
        run: |
          python DNS2Geo.py

      - name: List directory contents after
        shell: pwsh
        run: |
          Get-ChildItem
          if (Test-Path "CloudflareScanner") {
            Get-ChildItem "CloudflareScanner"
          } else {
            Write-Host "CloudflareScanner 目录不存在"
          }

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update IP/country info results'
          branch: ${{ github.ref_name }}
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com